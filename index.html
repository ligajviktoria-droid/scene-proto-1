<div id="boot"><p><b>Загрузка 3D-сцены…</b></p><p>Э1 · цех · управление v4</p><div id="err"></div></div>
<script>
(function () {
  var SRC = 'https://d2ol7oe51mr4n9.cloudfront.net/user_34YAuil8DLxoJBcWgRRVi8tVqfV/21897433-7633-4fb9-8355-ce5b437086b7.html';
  function fail(msg) { var d = document.getElementById('err'); d.className = 'err'; d.textContent = msg + ' Прямая ссылка: ' + SRC; }
  if (typeof fetch !== 'function') { fail('Браузер не поддерживает fetch.'); return; }
  fetch(SRC, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (html) { if (html.indexOf('<html') === -1) throw new Error('Получен не HTML'); document.open('text/html', 'replace'); document.write(html); document.close(); })
    .catch(function (e) { fail('Не удалось загрузить сцену: ' + e.message + '.'); });
})();
</script>
